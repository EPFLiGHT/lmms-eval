dataset_path: flaviagiammarino/path-vqa

task: "path_vqa_simple"

dataset_kwargs:
  token: True
test_split: test

output_type: loglikelihood

doc_to_visual: !function utils.pathvqa_doc_to_visual
doc_to_text: !function utils.pathvqa_doc_to_text
doc_to_target: !function utils.pathvqa_doc_to_target

generation_kwargs:
  max_new_tokens: 64
  do_sample: False

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: perplexity
    aggregation: mean
    higher_is_better: false

# process_results: !function utils.pathvqa_process_results

metadata:
  - version: 0.0

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Answer with a single short word or phrase only (no punctuation, no explanation). For yes/no questions, answer only “yes” or “no” without anything else."

