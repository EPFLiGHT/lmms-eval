dataset_path: flaviagiammarino/path-vqa

task: "path_vqa"

dataset_kwargs:
  token: True
test_split: test

output_type: generate_until


doc_to_visual: !function utils.pathvqa_doc_to_visual
doc_to_text: !function utils.pathvqa_doc_to_text
doc_to_target: !function utils.pathvqa_doc_to_target


generation_kwargs:
  max_new_tokens: 2048
  do_sample: False
  temperature: 0

metadata:
  - version: 0.0

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    #post_prompt: "\nAnswer with a single short word or phrase only (no punctuation, no explanation). If the answer is affirmative, reply 'Yes'; if negative, reply 'No'."
    post_prompt: "Let's think step by step. Detail your reasoning before answering carefully"

process_results: !function utils.pathvqa_process_results_with_llm_judge
metric_list:
- metric: "gpt_eval_pathvqa_all"
  aggregation: !function utils.pathvqa_llm_judge_aggregate
  higher_is_better: true
- metric: "gpt_eval_pathvqa_binary"
  aggregation: !function utils.pathvqa_llm_judge_binary_aggregate
  higher_is_better: true
- metric: "gpt_eval_pathvqa_nonbinary"
  aggregation: !function utils.pathvqa_llm_judge_nonbinary_aggregate
  higher_is_better: true
