dataset_path: &repo BoKelvin/SLAKE

task: "slake"

dataset_kwargs:
  token: True
test_split: test        # use "validation" if you prefer the val set

output_type: generate_until
doc_to_visual: !function utils.slake_doc_to_visual
doc_to_text: !function utils.slake_doc_to_text
doc_to_target: !function utils.slake_doc_to_target

generation_kwargs:
  max_new_tokens: 64
  do_sample: False
  temperature: 0

metric_list:
  - metric: overall_acc
    aggregation: !function utils.slake_aggregate_results
    higher_is_better: true
  - metric: binary_acc
    aggregation: !function utils.slake_aggregate_binary_results
    higher_is_better: true


process_results: !function utils.slake_process_results

metadata:
  - version: 0.0

lmms_eval_specific_kwargs:
  default:
    dataset_repo: *repo     # used by utils to auto-download imgs.zip
    # Filter to English by default (dataset has en/zh). Change to "zh" to evaluate Chinese.
    q_lang: "en"
    pre_prompt: ""
    post_prompt: "\nAnswer with a single word or short phrase only. If the question lists options (e.g., “lung, liver or heart”), choose exactly one of the listed options and output that word alone. For yes/no questions, answer only “Yes” or “No”."
    # post_prompt: "Let's think step by step. Detail your reasoning before answering carefully. Your answer should have the following format: <reasoning leading to the answer> Answer: <final answer>. If the answer is affirmative, reply 'Yes'; if negative, reply 'No'."
