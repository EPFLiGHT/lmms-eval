dataset_path: louis-mart/GMAI-MMBench-val

task: "gmai_simple"
dataset_kwargs:
  token: True
test_split: validation
output_type: multiple_choice
doc_to_visual: !function utils.gmai_doc_to_visual
doc_to_text: !function utils.gmai_doc_to_text
doc_to_target: "answer"
doc_to_choice: [ 'A', 'B', 'C', 'D', 'E' ]
# doc_to_choice: !function utils.gmai_doc_to_choice
  
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # post_prompt: ""
    post_prompt: "\nAnswer with a single letter: A, B, C, D, or E."
      
generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  do_sample: False

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true


metadata:
  - version: 0.0
